<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoofdsteden</title>
<meta name="description" content="Oefen hoofdsteden en vlaggen van de wereld.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hoofdsteden">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/baloo-2-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- HOME -->
  <section class="screen on" id="home">
    <div class="bar">
      <div class="brand"><span class="brand-dot"></span><span class="brand-txt" data-t="brand"></span></div>
      <div class="grow"></div>
      <button class="icon-btn lang" id="lang"></button>
      <button class="icon-btn" data-sound-toggle></button>
      <div class="seg mode" data-mode-switch></div>
    </div>
    <div class="home-mid">
      <div class="game">
        <div class="seg tabs" id="tabs">
          <span class="knob"></span>
          <button data-g="cap"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l9 4.5v2H3V7zM5 10.5h2.6v7H5zm5.7 0h2.6v7h-2.6zm5.7 0H19v7h-2.6zM3 19h18v2.5H3z"/></svg><span data-t="topicCap"></span></button>
          <button data-g="flag"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 2.5h2v19H5z"/><path d="M8 4c3-1.6 5.4 1.3 9-.2.8-.3 1.5.2 1.5 1v8.4c0 .5-.3.9-.8 1.1-3.3 1.3-5.9-1.5-9.7.2z"/></svg><span data-t="topicFlag"></span></button>
        </div>
        <div class="dir">
          <span class="dir-txt" id="dirtxt"></span>
          <button class="key swap" id="swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg></button>
        </div>
      </div>
      <div class="counter">
        <button class="key" id="minus">−</button>
        <div class="count-val"><b id="count">10</b><span data-t="questions"></span></div>
        <button class="key" id="plus">+</button>
      </div>
      <button class="pie-btn" id="start"></button>
      <div class="seen" id="seen"></div>
    </div>
    <button class="reset" id="reset"></button>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="quiz">
    <div class="bar">
      <button class="icon-btn" id="quit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="progress" aria-hidden="true"><i id="prog"></i></div>
      <div class="streak" id="streak" aria-live="polite"></div>
      <div class="seg mode" data-mode-switch></div>
    </div>
    <p class="ask" id="ask"></p>
    <div class="stage" id="stage">
      <div class="scene" id="scene"></div>
      <div class="reveal">
        <div class="tag-slot" id="tagslot"></div>
        <button class="key green next" id="next"><span data-t="next"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="answer" id="answer"></div>
  </section>

  <!-- EINDE -->
  <section class="screen" id="end">
    <div class="bar"><div class="brand"><span class="brand-dot"></span><span class="brand-txt" data-t="brand"></span></div></div>
    <div class="end-mid">
      <div class="score" id="score"></div>
      <div class="end-word" id="endword"></div>
      <div class="end-streak" id="endstreak"></div>
      <div class="misses" id="misses"></div>
      <div class="end-actions">
        <button class="key" id="tohome" data-t="home"></button>
        <button class="key green" id="again" data-t="again"></button>
      </div>
    </div>
  </section>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
